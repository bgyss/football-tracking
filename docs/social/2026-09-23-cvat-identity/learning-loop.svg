<text x="1110" y="347" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#102D32">Correct in CVAT</text>
<text x="1110" y="387" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#486367">Fix boxes, splits and identity.</text>
<text x="1110" y="416" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#486367">A person still reviews the labels.</text>
