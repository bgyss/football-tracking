<text x="598" y="627" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#486367">Curate football training examples.</text>
<text x="598" y="656" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#486367">Automate repeatable training runs.</text>
