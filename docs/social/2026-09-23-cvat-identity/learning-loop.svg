<text x="86" y="587" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#102D32">Evaluate + repeat</text>
<text x="86" y="627" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#486367">Test on held-out games.</text>
<text x="86" y="656" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#486367">Adopt only verified improvements.</text>
