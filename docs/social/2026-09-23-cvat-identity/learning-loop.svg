<text x="94" y="777" font-family="DejaVu Sans" font-size="36" font-weight="700" fill="#FFFFFF">Boxes train the detector. Tracks test identity.</text>
<text x="94" y="819" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#C3DBD0">Current: annotation interchange + identity review tooling.</text>
<text x="94" y="855" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#C3DBD0">Ahead: end-to-end retraining automation + measured speed and accuracy gains.</text>
