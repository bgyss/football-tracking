<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Toward an automated All-22 learning loop</title><desc id="desc">Implemented annotation and identity tooling feeds a planned fine-tuning and evaluation loop. Human review remains required today.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#486367" stroke-width="1.5"/></marker></defs>
