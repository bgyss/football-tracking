<text x="598" y="387" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#486367">RF-DETR + shot-local tracking</text>
<text x="598" y="416" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#486367">Generate proposals for review.</text>
<rect x="1088" y="266" width="448" height="180" rx="12" fill="#FFFFFF" stroke="#CDD5CE" stroke-width="2"/>
