<text x="86" y="347" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#102D32">All-22 footage</text>
<text x="86" y="387" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#486367">Sideline + end-zone views</text>
<text x="86" y="416" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#486367">Keep the source frame and time.</text>
