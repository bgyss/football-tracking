<text x="64" y="158" font-family="DejaVu Sans" font-size="64" font-weight="700" fill="#102D32">Making every correction count.</text>
<text x="64" y="210" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#486367">The goal: faster All-22 processing and more accurate play reconstruction.</text>
