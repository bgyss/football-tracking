[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-tracking"
version = "0.1.0"
description = "Offline American football player tracking with RF-DETR and Roboflow trackers"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "pyarrow>=17",
  "scipy>=1.13",
]

[project.optional-dependencies]
roboflow = [
  "rfdetr==1.10.1",
  "trackers==2.6.0",
  "supervision==0.30.2",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
football-tracking = "football_tracking.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
